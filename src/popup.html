<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de Xadrez Pro</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <img src="icons/crown.png" alt="Logo" class="logo">
            <div class="header-text">
                <h1>Analisador de Xadrez Pro</h1>
                <span class="version">v1.9.16</span>
            </div>
        </header>

        <div class="status-bar" id="status">
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span class="status-text">Status</span>
            </div>
            <span class="status-value" id="connection-status">Verificando...</span>
        </div>

        <div class="power-section">
            <button class="power-btn on" id="power-btn">Extensão ligada</button>
            <div class="power-hint" id="power-hint">Clique para desligar tudo (painel, motor e maratona).</div>
        </div>

        <div class="controls-section">
            <button class="btn btn-primary" id="toggle-panel">
                Mostrar/Ocultar Analisador
            </button>
        </div>

        <footer class="footer">
            <a href="https://t.me/shaa5844" target="_blank">Desenvolvido por Shakar Mustafa</a>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>

</html>
