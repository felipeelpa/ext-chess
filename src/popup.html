<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Analyzer Pro</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <img src="icons/crown.png" alt="Logo" class="logo">
            <div class="header-text">
                <h1 data-i18n="p.title">Analisador de Xadrez Pro</h1>
                <span class="version" id="version"></span>
            </div>
        </header>

        <div class="status-bar" id="status">
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span class="status-text" data-i18n="p.status">Status</span>
            </div>
            <span class="status-value" id="connection-status" data-i18n="p.checking">Verificando...</span>
        </div>

        <div class="lang-row">
            <label for="lang-select" data-i18n="p.language">Idioma</label>
            <select id="lang-select" class="lang-select"></select>
        </div>

        <div class="power-section">
            <button class="power-btn on" id="power-btn">Extensão ligada</button>
            <div class="power-hint" id="power-hint">Clique para desligar tudo (painel, motor e maratona).</div>
        </div>

        <div class="controls-section">
            <button class="btn btn-primary" id="toggle-panel" data-i18n="p.toggle">
                Mostrar/Ocultar Analisador
            </button>
        </div>

        <footer class="footer">
            <a href="donate.html" target="_blank" id="coffee-link" class="coffee-btn"><svg class="coffee-ico" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M5 9h11v5.5A4.5 4.5 0 0 1 11.5 19h-2A4.5 4.5 0 0 1 5 14.5V9z" fill="#1a1a1a"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16" fill="none" stroke="#1a1a1a" stroke-width="1.8"/><path d="M8 3.5c0 1.2 1 1.2 1 2.4M11 3c0 1.2 1 1.2 1 2.4M14 3.5c0 1.2 1 1.2 1 2.4" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round"/><rect x="4" y="20" width="14" height="1.8" rx=".9" fill="#1a1a1a"/></svg><span id="coffee-text" data-i18n="p.coffee">Pague-me um café</span></a>
        </footer>
    </div>

    <script src="i18n.js"></script>
    <script src="popup.js"></script>
</body>

</html>
