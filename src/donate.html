<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pague-me um café</title>
    <link rel="stylesheet" href="donate.css">
</head>

<body>
    <main class="card">
        <svg class="cup" viewBox="0 0 24 24" width="56" height="56" aria-hidden="true"><path d="M5 9h11v5.5A4.5 4.5 0 0 1 11.5 19h-2A4.5 4.5 0 0 1 5 14.5V9z" fill="#f5b53a"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16" fill="none" stroke="#f5b53a" stroke-width="1.8"/><path d="M8 3.5c0 1.2 1 1.2 1 2.4M11 3c0 1.2 1 1.2 1 2.4M14 3.5c0 1.2 1 1.2 1 2.4" fill="none" stroke="#f5b53a" stroke-width="1.4" stroke-linecap="round"/><rect x="4" y="20" width="14" height="1.8" rx=".9" fill="#f5b53a"/></svg>
        <h1 id="d-title" data-i18n="d.title">Pague-me um café</h1>
        <p id="d-text" data-i18n="d.text"></p>

        <div id="d-has" hidden>
            <label class="label" data-i18n="d.address">Endereço Bitcoin (BTC)</label>
            <div class="addr-row">
                <code id="d-addr"></code>
                <button id="d-copy" type="button" data-i18n="d.copy">Copiar</button>
            </div>
            <p class="warn" data-i18n="d.warn"></p>
        </div>
        <p id="d-soon" class="soon" hidden data-i18n="d.soon">Endereço em breve.</p>

        <div class="lang-row">
            <select id="d-lang" aria-label="Language"></select>
        </div>
    </main>

    <script src="i18n.js"></script>
    <script src="donate-config.js"></script>
    <script src="donate.js"></script>
</body>

</html>
