<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Analyzer Pro</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <img src="icons/crown.png" alt="Logo" class="logo">
            <div class="header-text">
                <h1>Chess Analyzer Pro</h1>
                <span class="version">v1.0</span>
            </div>
        </header>

        <div class="status-bar" id="status">
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span class="status-text">Connecting...</span>
            </div>
            <span class="status-value" id="connection-status">Checking...</span>
        </div>

        <div class="controls-section">
            <button class="btn btn-primary" id="toggle-panel">
                Show/Hide Analyzer
            </button>
        </div>

        <footer class="footer">
            <a href="https://t.me/shaa5844" target="_blank">Developed by Shakar Mustafa</a>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>

</html>
